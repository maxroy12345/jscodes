<!DOCTYPE html>
<html>
<head>
    <title>Experiment 8</title>
</head>

<body>

    <h3>Name: Mohammad Saad Ahmed</h3>
    <h3>Roll No: 42428</h3>

    <label for="" class="ip1" onmouseover="myfun()" onmouseleave="mouseleave()">
        Change Home page background color
    </label>

    <br><br><br>

    <input placeholder="Click here for focus event" id="ip2" type="text" onfocus="focusevent()" onblur="blurevent()">

</body>

<script>

    function myfun() {
        document.body.style.backgroundColor = 'red';
    }

    function focusevent() {
        document.getElementById("ip2").style.backgroundColor = 'green';
        document.body.style.background = 'blue';
    }

    function blurevent() {
        document.getElementById("ip2").style.backgroundColor = 'white';
        document.body.style.background = 'green';
    }

    function mouseleave() {
        document.body.style.background = 'white';
    }

</script>

</html>
