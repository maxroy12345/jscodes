<!DOCTYPE html>

<html>
<head>
    <title>Countdown Timer</title>
</head>
<body>

    <h2>Countdown to Future Date</h2>

    Select Target Date and Time:
    <input type="datetime-local" id="date"><br><br>

    <button onclick="start()">Start Countdown</button>

    <h1 id="result"></h1>

    <script>

        function start()
        {
            let target = new Date(document.getElementById("date").value).getTime();

            let timer = setInterval(function()
            {
                let now = new Date().getTime();

                let diff = target - now;

                if(diff <= 0)
                {
                    clearInterval(timer);
                    document.getElementById("result").innerHTML =
                    "Target Date Reached!";
                    return;
                }

                let days = Math.floor(diff / (1000 * 60 * 60 * 24));

                let hours = Math.floor((diff / (1000 * 60 * 60)) % 24);

                let minutes = Math.floor((diff / (1000 * 60)) % 60);

                let seconds = Math.floor((diff / 1000) % 60);

                document.getElementById("result").innerHTML =
                days + " Days " + hours + " Hours " +
                minutes + " Minutes " + seconds + " Seconds";

            }, 1000);
        }

    </script>


</body>
</html>
